name: TOSMC TEST2v2 – Workflow-Bereinigung V1
run-name: Workflow-Bereinigung – ${{ inputs.modus }}
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "VORSCHAU oder UEBERNEHMEN (archiviert nur vier historische Test-Workflows)"
        required: true
        type: choice
        default: VORSCHAU
        options:
          - VORSCHAU
          - UEBERNEHMEN

permissions:
  contents: write

concurrency:
  group: tosmc-test2v2-workflow-bereinigung-v1
  cancel-in-progress: false

jobs:
  archivieren:
    if: github.repository == 'OldSmugglersClub/the-old-smugglers-club-test2-v2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Dateien und unveraenderten Quellstand pruefen
        id: pruefung
        env:
          MODUS: ${{ inputs.modus }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          # Diese Blob-SHAs wurden vor Erstellung am 04.11.2026 aus TEST2v2/main gelesen.
          candidates = {
            'hf16-live-bereinigung.yml': '7154f9cc4588c85016c4f5f033f806ec70ccb660',
            'tosmc-test2v2-11-remote-writeproof.yml': '93d23c0893a92be3d4dddde63e9843284cf22027',
            'tosmc-test2v2-11-terminpruefung.yml': '5d446653a601537447b933110ece2b9ffae1138d',
            'tosmc-test2v2-11-isolationstest.yml': 'f76c80731de20250a527737eceec61fa3727c258',
          }
          src = pathlib.Path('.github/workflows')
          dest = pathlib.Path('docs/workflow-archiv/2026-11-04-test2v2')
          missing = []
          changed = []
          for name, expected in candidates.items():
              path = src/name
              if not path.is_file():
                  missing.append(name)
                  continue
              actual = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
              if actual != expected:
                  changed.append((name, actual))
          print('Modus:', os.environ['MODUS'])
          print('Archivkandidaten:', *candidates, sep='\n - ')
          print('Fehlend:', missing)
          print('Seit Vorpruefung geaendert:', changed)
          if changed:
              sys.exit('ABBRUCH: mindestens eine Quelldatei wurde geaendert. Erneute Fachpruefung erforderlich.')
          if missing:
              sys.exit('ABBRUCH: Kandidaten fehlen; kein unvollstaendiger Archivlauf.')
          if os.environ['MODUS'] == 'VORSCHAU':
              print('VORSCHAU: Keine Dateien geaendert.')
              sys.exit(0)
          if os.environ['MODUS'] != 'UEBERNEHMEN':
              sys.exit('Unbekannter Modus')
          dest.mkdir(parents=True, exist_ok=True)
          for name in candidates:
              if (dest/name).exists():
                  sys.exit('ABBRUCH: Archivziel existiert bereits: '+name)
          for name in candidates:
              (src/name).rename(dest/name)
          print('Vier Alt-Workflows lokal archiviert. Commit folgt.')
          PY
      - name: Archivierung committen und pushen
        if: inputs.modus == 'UEBERNEHMEN'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows docs/workflow-archiv/2026-11-04-test2v2
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "TEST2v2 Workflow-Bereinigung V1: vier historische Tests archivieren"
          git push origin HEAD:main
      - name: Ergebnis
        run: |
          echo "Modus: ${{ inputs.modus }}"
          echo "Dauer-Workflows und taegliche 11-Termine-Uebernahme wurden nicht angefasst."
