name: TOSMC TEST27 – Draft-PR Sicherheitsprüfung (READ ONLY)
run-name: TEST27 – Kein PR, kein Commit, keine Website-Aenderung
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test27-nur-pruefen:
    if: github.repository == 'OldSmugglersClub/the-old-smugglers-club-test2-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TEST21 Schutzregression
        run: node scripts/TEST_offizielle_quellen_TEST21.mjs
      - name: TEST27 Quellen-PR-Schutztests
        run: node scripts/TEST_offizielle_quellen_TEST27.mjs --report
      - name: Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TOSMC-TEST27-SCHUTZBERICHT
          path: test27-bericht/
          if-no-files-found: warn
          retention-days: 14
