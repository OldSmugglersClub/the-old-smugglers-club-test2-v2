name: TOSMC TEST2v2 – Offizielle Terminquellen (nur Diagnose)
run-name: Terminquellen-Diagnose (manuell oder täglich, READ-ONLY)
on:
  workflow_dispatch:
    inputs:
      test20_freigabe:
        description: 'Nur fuer TEST2v2: TEST2V2_FREIGABE eingeben (sonst nur Diagnose)'
        required: false
        default: ''
        type: string
      test20_bestands_sha256:
        description: 'Quelle-SHA256 aus frischem TEST19_MANIFEST.json eingeben'
        required: false
        default: ''
        type: string
  schedule:
    # 07:17 UTC täglich: 08:17 MEZ / 09:17 MESZ; tatsächlichen GitHub-Start separat überwachen.
    - cron: '17 7 * * *'
permissions:
  contents: read
concurrency:
  group: tosmc-test2v2-offizielle-terminquellen
  cancel-in-progress: false
jobs:
  terminquellen-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Bestehenden TEST2v2 Stand auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parser- und Schutztests
        run: |
          node scripts/TEST_offizielle_quellen.mjs
          node scripts/TEST_offizielle_quellen_TEST4.mjs
          node scripts/TEST_offizielle_quellen_TEST5.mjs
          node scripts/TEST_offizielle_sonderquellen_TEST16.mjs
          node scripts/TEST_offizielle_quellen_TEST18.mjs
          node scripts/TEST_offizielle_quellen_TEST19.mjs
          node scripts/TEST_offizielle_quellen_TEST20.mjs
      - name: Aktuellen TEST2v2-Datenstand auf Vorhandensein prüfen
        run: |
          test -f spieldaten.json
          test -f terminwaechter/offizielle-quellen.json
      - name: Offizielle Seiten abfragen und Bericht erstellen
        run: |
          if node scripts/offizielle-quellen.mjs; then
            echo "HTML-Quellendiagnose vollständig."
          else
            code=$?
            if [ "$code" -eq 2 ] && node -e '
              const fs=require("node:fs");
              const p="terminwaechter-bericht/OFFIZIELLE_QUELLEN_BERICHT.json";
              if (!fs.existsSync(p)) process.exit(1);
              const x=JSON.parse(fs.readFileSync(p,"utf8"));
              if (x.status!=="UNVOLLSTAENDIG" || x.automatischeAenderung!==false ||
                  !Array.isArray(x.befunde) || !Array.isArray(x.quellen)) process.exit(1);
            '; then
              echo "::warning::FACHLICH_UNVOLLSTAENDIG: HTML-Quellendiagnose Exit 2, gültiger READ-ONLY-Bericht vorhanden."
            else
              echo "::error::TECHNISCHER_FEHLER: HTML-Diagnose Exit $code oder Bericht unvollständig/ungültig." >&2
              exit 1
            fi
          fi
      - name: Browser für offizielle Spielplanseiten installieren
        if: success() || failure()
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Offizielle Spielplandaten im Browser prüfen
        if: success() || failure()
        run: |
          node scripts/TEST_offizielle_quellen_TEST7.mjs
          node scripts/TEST_offizielle_quellen_TEST8.mjs
          if node scripts/offizielle-quellen-browser.mjs; then
            echo "Browserdiagnose vollständig."
          else
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "FACHLICH_UNVOLLSTAENDIG: Browserdiagnose liefert Exit 2. TEST18 bewertet die Berichte separat."
            else
              echo "TECHNISCHER_FEHLER im Browserdiagnoseprogramm: Exit $code" >&2
              exit "$code"
            fi
          fi
      - name: Offizielle Sonderquellen zusätzlich prüfen (read-only)
        if: success() || failure()
        run: node scripts/offizielle-sonderquellen-test16.mjs
      - name: TEST18 – Technischen Status und Korrekturvorschläge erstellen
        if: always()
        run: node scripts/offizielle-quellen-test18-auswertung.mjs
      - name: TEST19 – Geschützte Korrekturvorschau erzeugen (kein Einspielen)
        if: always()
        run: node scripts/offizielle-quellen-test19-vorschau.mjs
      - name: TEST20 – Freigabe pruefen und ggf. Austauschdatei nur als Artefakt vorbereiten
        if: always()
        env:
          TEST20_APPROVAL: ${{ github.event.inputs.test20_freigabe || '' }}
          TEST20_SOURCE_SHA: ${{ github.event.inputs.test20_bestands_sha256 || '' }}
        run: node scripts/offizielle-quellen-test20-freigabe.mjs
      - name: Diagnoseberichte auch nach Abbruch bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tosmc-test2v2-offizielle-quellen-diagnose
          path: terminwaechter-bericht/
          if-no-files-found: warn
          retention-days: 14
