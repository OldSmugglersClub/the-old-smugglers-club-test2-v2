name: TOSMC TEST28 – Isolierter Draft-PR (nur Testdatei)
run-name: TEST28 – NUR SANDBOX-DRAFT-PR, NIEMALS MERGEN
on:
  workflow_dispatch:
    inputs:
      test28_freigabe:
        description: 'Erst nach ausdruecklicher Freigabe TEST28_NUR_TESTDATEI_PR eingeben'
        required: true
        type: string
permissions:
  contents: read
jobs:
  isolierter-test28-draft:
    if: github.repository == 'OldSmugglersClub/the-old-smugglers-club-test2-v2' && github.ref == 'refs/heads/main' && inputs.test28_freigabe == 'TEST28_NUR_TESTDATEI_PR'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: TEST2v2 main pruefen
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pflicht-Schutztests ohne Schreibzugriff
        run: node scripts/TEST_offizielle_quellen_TEST28.mjs
      - name: Isolierten Testdatei-PR als Draft erzeugen – kein Merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST28_APPROVAL: ${{ inputs.test28_freigabe }}
        run: node scripts/test28-isolierter-draft-pr.mjs
