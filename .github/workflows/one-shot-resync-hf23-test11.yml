name: One-shot resync HF23 TEST11

on:
  push:
    branches:
      - resync-hf23-test11
    paths:
      - .github/workflows/one-shot-resync-hf23-test11.yml

permissions:
  contents: write

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Test2-v2 target
        uses: actions/checkout@v4
        with:
          path: work
          ref: resync-hf23-test11

      - name: Checkout current Live HF23
        uses: actions/checkout@v4
        with:
          repository: OldSmugglersClub/the-old-smugglers-club
          ref: main
          path: live

      - name: Sync Live project and overlay approved CL TEST11
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' --exclude='.github/workflows/' live/ work/
          cd work

          python3 - <<'PY'
          from pathlib import Path
          import re

          version = '4.9.2-HF12-HF23-TEST11'

          js = Path('wettbewerb.js')
          text = js.read_text(encoding='utf-8')
          old_url = 'https://api.openligadb.de/getmatchdata/ucl/2026'
          new_url = 'https://api.openligadb.de/getmatchdata/ucl2026/2026'
          if old_url not in text and new_url not in text:
              raise SystemExit('CL OpenLigaDB URL anchor not found')
          text = text.replace(old_url, new_url)

          complete_line = '    const complete = rows.length >= 36 && rows.every(team => team.played >= 8);\n'
          if complete_line not in text:
              anchor = '''    const rows = [...teams.values()].sort((a, b) => {\n      if (b.points !== a.points) return b.points - a.points;\n      const gdA = a.goalsFor - a.goalsAgainst;\n      const gdB = b.goalsFor - b.goalsAgainst;\n      if (gdB !== gdA) return gdB - gdA;\n      if (b.goalsFor !== a.goalsFor) return b.goalsFor - a.goalsFor;\n      return a.name.localeCompare(b.name, "de");\n    });\n\n'''
              if anchor not in text:
                  raise SystemExit('CL standings anchor not found')
              text = text.replace(anchor, anchor + '    // Ligaphase ist erst vollständig, wenn alle 36 Teams ihre acht Spiele absolviert haben.\n' + complete_line + '\n', 1)
          js.write_text(text, encoding='utf-8')

          page = Path('champions-league.html')
          html = page.read_text(encoding='utf-8')
          html, count = re.subn(r'(<script src="\./wettbewerb\.js\?v=)[^"]+(" defer></script>)', rf'\g<1>{version}\2', html, count=1)
          if count != 1:
              raise SystemExit('Champions League cache-buster anchor not found')
          page.write_text(html, encoding='utf-8')

          Path('VERSION.txt').write_text(f'Website {version}\n', encoding='utf-8')

          Path(f'CHANGELOG_{version}.md').write_text(f'''# CHANGELOG – Website {version}\n\n## Basis\n- Vollständiger Projektstand der freigegebenen Live-Version `4.9.2-HF12-HF23`.\n- Gemeinsame Test2-v2-Projektdateien einschließlich Saison- und Wertungsdaten wurden auf den Live-HF23-Stand zurückgeführt.\n\n## Champions League – TEST11\n- TEST10 bleibt erhalten: Die Ligaphase gilt erst als vollständig, wenn mindestens 36 Teams vorhanden sind und jedes Team acht Spiele absolviert hat.\n- TEST11 bleibt erhalten: OpenLigaDB-Quelle `ucl2026/2026`.\n- Cache-Buster der Champions-League-Seite auf `{version}` gesetzt.\n\n## Unverändert\n- Keine Änderung an Grid, Kachelgrößen, Navigation oder Grundlayout.\n- Keine Änderung am Admin oder an der Kicktipp-Auswertung gegenüber Live HF23.\n- Kein automatischer CL-Import in `spieldaten.json`.\n''', encoding='utf-8')

          Path(f'README_{version}.md').write_text(f'''# Website {version}\n\nBereinigter Test2-v2-Stand für den ersten echten Bundesliga-Teilabschluss.\n\n## Grundlage\n- Funktionaler und saisonaler Datenstand: Live `4.9.2-HF12-HF23`.\n- Einzige darüberliegende funktionale Teständerung: Champions-League-TEST11 einschließlich der TEST10-Tabellenkorrektur.\n\n## Pakete\n- `update.zip`: Overlay gegenüber Live `4.9.2-HF12-HF23`.\n- `full.zip`: vollständige Neuablage dieses Teststands.\n- Beide ZIPs werden durch den Build als GitHub-Actions-Artefakte erzeugt; `full.zip` wird wegen der GitHub-Einzeldateigrenze nicht ins Repository committed.\n\n## Pflichtprüfung\n1. Bundesliga-Seite und Startseite laden.\n2. Admin-Import vor dem Teilabschluss nur mit echten Kicktipp-Daten durchführen.\n3. 1/9-Teilabschluss kontrollieren: Highscore, Ranglistenverlauf, Teamwertung, Tippverteilung und Logbuch.\n4. Champions-League-Seite separat auf OpenLigaDB-Daten und JavaScript-Fehler prüfen.\n''', encoding='utf-8')

          Path(f'DATEILISTE_ERSETZEN_NEU_LOESCHEN_{version}.md').write_text(f'''# Ersetzen / Neu / Löschen – {version}\n\n## ERSETZEN gegenüber Live 4.9.2-HF12-HF23\n- `wettbewerb.js`\n- `champions-league.html`\n- `VERSION.txt`\n\n## NEU\n- `CHANGELOG_{version}.md`\n- `README_{version}.md`\n- `DATEILISTE_ERSETZEN_NEU_LOESCHEN_{version}.md`\n- Build-Artefakt `update.zip`\n- Build-Artefakt `full.zip`\n\n## LÖSCHEN\n- Keine Projektdateien.\n\nHinweis: Beim Bereinigen des Test-Repositories werden gemeinsame Projektdateien auf den aktuellen Live-HF23-Stand zurückgeführt. Historische TEST-Dokumentation bleibt als Archiv erhalten.\n''', encoding='utf-8')
          PY

      - name: Build update and full packages
        shell: bash
        run: |
          set -euo pipefail
          VERSION='4.9.2-HF12-HF23-TEST11'
          rm -rf /tmp/tosmc-packages /tmp/tosmc-full
          mkdir -p /tmp/tosmc-packages/update /tmp/tosmc-full

          cd work
          cp wettbewerb.js champions-league.html VERSION.txt /tmp/tosmc-packages/update/
          cp "CHANGELOG_$VERSION.md" "README_$VERSION.md" "DATEILISTE_ERSETZEN_NEU_LOESCHEN_$VERSION.md" /tmp/tosmc-packages/update/
          (cd /tmp/tosmc-packages/update && zip -qr ../update.zip .)

          cd "$GITHUB_WORKSPACE"
          rsync -a --exclude='.git/' live/ /tmp/tosmc-full/
          cp work/wettbewerb.js work/champions-league.html work/VERSION.txt /tmp/tosmc-full/
          cp work/"CHANGELOG_$VERSION.md" work/"README_$VERSION.md" work/"DATEILISTE_ERSETZEN_NEU_LOESCHEN_$VERSION.md" /tmp/tosmc-full/
          (cd /tmp/tosmc-full && zip -qr /tmp/tosmc-packages/full.zip .)

      - name: Commit synchronized Test2-v2 branch
        shell: bash
        run: |
          set -euo pipefail
          cd work
          git config user.name 'OldSmugglersClub'
          git config user.email 'captain@the-old-smugglers-club.de'
          git add -A
          git commit -m 'Test2-v2: resync to HF23 plus approved TEST11' || true
          git push origin HEAD:resync-hf23-test11

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: TOSMC-4.9.2-HF12-HF23-TEST11-Update
          path: /tmp/tosmc-packages/update.zip
          compression-level: 0

      - name: Upload full package
        uses: actions/upload-artifact@v4
        with:
          name: TOSMC-4.9.2-HF12-HF23-TEST11-Full
          path: /tmp/tosmc-packages/full.zip
          compression-level: 0
